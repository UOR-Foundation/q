# Publishes the agent's kernel the way UOR-Foundation/community publishes its decisions:
# build and verify the holo, sign its SLSA provenance as this workflow, and serve it at
# https://uor-foundation.github.io/uor-discord-agent/app.holo. Anyone can then check it
# as the agent checks the community's: fetch, label, verify the signature against
# .github/workflows/holo.yml@refs/heads/main, replay its vectors.
name: holo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holo
  cancel-in-progress: false

jobs:
  build:
    name: build, verify and sign the holo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npx --yes prism-code@0.11.2 build --json
      - run: npx --yes prism-code@0.11.2 verify --json
      - name: Assemble the page
        run: |
          mkdir -p site
          cp app/.prism/build/uor-discord-agent.holo site/app.holo
          node -e 'const {createHash}=require("crypto");const b=require("fs").readFileSync("site/app.holo");console.log("sha256:"+createHash("sha256").update(b).digest("hex"))'
      - name: Sign the holo's provenance as this workflow
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: site/app.holo
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site

  deploy:
    name: publish the holo
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
